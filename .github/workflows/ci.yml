name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  UV_FROZEN: "1"
  LANGSMITH_TRACING: "false"

jobs:
  lint:
    name: Lint, format and mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: make lint
      - run: make check_imports
      - run: make check_version

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests with coverage gate (100%)
        run: make test

  test-min:
    name: Tests (minimum supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
      - name: Install the lowest versions allowed by pyproject.toml
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e . --group test --group typing
          uv pip list | grep -E '^(langchain|langchain-core|langgraph|acgs-lite) '
      - run: .venv/bin/python -m pytest --disable-socket --allow-unix-socket --cov --cov-report=term-missing tests/unit_tests/ langchain_acgs/
      - run: .venv/bin/python -m mypy
