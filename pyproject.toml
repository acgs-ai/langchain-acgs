[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-acgs"
version = "0.1.0"
description = "ACGS tool-call governance middleware for LangChain agents"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Martin Lyu" }]
keywords = ["langchain", "langgraph", "agents", "middleware", "governance", "acgs", "guardrails", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain>=1.2.15,<2.0.0",
    "langchain-core>=1.2.10,<2.0.0",
    "langgraph>=1.1.5,<2.0.0",
    "acgs-lite>=3.0.1,<4.0.0",
    "typing-extensions>=4.7.0",
]

[project.urls]
Documentation = "https://github.com/acgs-ai/langchain-acgs#readme"
Repository = "https://github.com/acgs-ai/langchain-acgs"
Issues = "https://github.com/acgs-ai/langchain-acgs/issues"
Changelog = "https://github.com/acgs-ai/langchain-acgs/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
]
lint = ["ruff>=0.15.0,<0.16.0"]
typing = ["mypy>=1.18.0,<3.0.0"]
dev = []

[tool.hatch.build.targets.sdist]
include = ["langchain_acgs", "tests", "examples", "scripts", "CHANGELOG.md", "README.md", "LICENSE", "Makefile"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_acgs"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["langchain_acgs", "tests", "examples", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "COM", "D", "E", "EM", "F", "FA", "FBT", "FLY", "I", "ICN",
    "INT", "ISC", "N", "PERF", "PGH", "PIE", "PL", "PT", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF",
    "SLOT", "T10", "T20", "TC", "TID", "UP", "W", "YTT",
]
ignore = [
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "PERF203", # try/except in loops is intentional in the examples' checks
    "PLR0913", # keyword-only configuration arguments
    "TC001", "TC002", "TC003",  # runtime imports keep the public API introspectable
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Shared verbatim with acgs-haystack and strands-acgs, which use Sphinx-style docstrings.
"langchain_acgs/_governance.py" = ["D212", "D205", "D415", "RUF100", "BLE001", "ANN401"]
"tests/**/*.py" = ["D", "S101", "PLR2004", "ANN401", "ARG", "SLF001", "FBT", "PLC0415"]
"examples/**/*.py" = ["T201", "D", "ARG", "ANN401"]
"scripts/**/*.py" = ["T201", "INP001"]

[tool.coverage.run]
source = ["langchain_acgs"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 --doctest-modules --import-mode=importlib"
testpaths = ["tests", "langchain_acgs"]
markers = ["compile: mark placeholder test used to compile integration tests without running them"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
